            else if (k.key === 'u' || k.key === 'U') { top = Math.max(top - 10, 0); }
            else { return; }
            st = draw(); return;
          }
          var key = k.key;
          if (key === 'q' || key === 'Escape') { off(); done(); return; }
          if (key === ' ' || key === 'PageDown' || key === 'f') {
            if (st.atEnd) { off(); done(); return; }
            top = Math.min(top + st.pageH, st.last);
          }
          else if (key === 'b' || key === 'PageUp') { top = Math.max(top - st.pageH, 0); }
          else if (key === 'ArrowDown' || key === 'j' || key === 'Enter') { top = Math.min(top + 1, st.last); }
          else if (key === 'ArrowUp' || key === 'k') { top = Math.max(top - 1, 0); }
          else if (key === 'g') { top = 0; }
          else if (key === 'G') { top = st.last; }
          else { return; }
          st = draw();
        });
      }).then(function () {
        window.removeEventListener('keydown', guard, true);
        tui.write(cup(0, shown) + '\x1b[0J');
        tui.release();
      });
    }

    var COMMANDS = [
      { name: 'ls', description: 'list directory contents: ls [dir]', run: function (ctx, argv) {
        var p = argv[1] || '.', entries = ctx.listDir(p);
        if (!entries) { ctx.stdout.print('ls: ' + p + ': not a directory'); return; }
        if (!entries.length) { ctx.stdout.print('(empty)'); return; }
        entries.forEach(function (e) { ctx.stdout.print('  ' + (e.dir ? STYLE.dir + e.name + '/' + RESET : e.name)); });
      } },
      { name: 'cat', description: 'print documents: cat <path> [path...]', run: function (ctx, argv) {
        var files = argv.slice(1);
        if (!files.length) { ctx.stdout.print('usage: cat <path> [path...]'); return; }
        files.forEach(function (f) {
          var t = docText(ctx, f);
          if (t === null) { ctx.stdout.print('cat: ' + f + ': no such file'); return; }
          ctx.stdout.write(t);
        });
      } },
      { name: 'head', description: 'first lines: head [-n N | -N] [path...]', run: function (ctx, argv) {
        var o = parseN(argv), ins = inputs(ctx, o.files, 'head'), many = ins.length > 1;
        ins.forEach(function (i) { if (many) { ctx.stdout.print('==> ' + i.name + ' <=='); } ctx.stdout.write(fromLines(toLines(i.text).slice(0, o.n))); });
      } },
      { name: 'tail', description: 'last lines: tail [-n N | -N] [path...]', run: function (ctx, argv) {
        var o = parseN(argv), ins = inputs(ctx, o.files, 'tail'), many = ins.length > 1;
        ins.forEach(function (i) { if (many) { ctx.stdout.print('==> ' + i.name + ' <=='); } ctx.stdout.write(fromLines(toLines(i.text).slice(-o.n))); });
      } },
      { name: 'grep', description: 'lines matching a pattern: grep <pattern> [path...]', run: function (ctx, argv) {
        var args = argv.slice(1).filter(function (a) { return a.indexOf('-') !== 0; }), pat = args[0];
        if (!pat) { ctx.stdout.print('usage: grep <pattern> [path...]'); return; }
        var re; try { re = new RegExp(pat); } catch (e) { re = new RegExp(pat.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')); }
        var ins = inputs(ctx, args.slice(1), 'grep'), many = ins.length > 1, hits = [];
        ins.forEach(function (i) { i.text.split('\n').forEach(function (l) { if (re.test(stripAnsi(l))) { hits.push(many ? i.name + ':' + l : l); } }); });
        if (hits.length) { ctx.stdout.print(hits.join('\n')); }
      } },
      { name: 'find', description: 'walk the FS: find [path...] [-name GLOB] [-type f|d]', run: function (ctx, argv) {
        var starts = [], name = null, type = null;
        for (var i = 1; i < argv.length; i++) {
          var a = argv[i];
          if (a === '-name') { var g = argv[++i]; if (g) { name = globToRegExp(g); } }
          else if (a === '-type') { var t = argv[++i]; if (t === 'f' || t === 'd') { type = t; } }
          else if (a.indexOf('-') !== 0) { starts.push(a); }
        }
        if (!starts.length) { starts = ['.']; }
        var out = [];
        var keep = function (disp, isDir) {
          if (type && ((type === 'f') === isDir)) { return; }
          if (name && !name.test(disp.split('/').pop() || disp)) { return; }
          out.push(disp);
        };
        starts.forEach(function (s) {
          var p = resolvePath(s, ctx.cwd), isDir = isDirPath(p, ctx);
          if (!isDir && !isFilePath(p, ctx)) { ctx.stdout.print('find: ' + s + ': no such file or directory'); return; }
          var disp = s.replace(/\/+$/, '') || '/';
          keep(disp, isDir);
          if (isDir) { var items = []; walk(p, disp, ctx, items); items.forEach(function (it) { keep(it.disp, it.dir); }); }
        });
        if (out.length) { ctx.stdout.print(out.join('\n')); }
      } },
      { name: 'tree', description: 'draw the FS as a tree: tree [path]', run: function (ctx, argv) {
        var s = argv[1] || '.', p = resolvePath(s, ctx.cwd);
        if (!isDirPath(p, ctx)) { ctx.stdout.print('tree: ' + s + ': not a directory'); return; }
        var lines = [s.replace(/\/+$/, '') || '/'], count = { dirs: 0, files: 0 };
        var rec = function (path, prefix) {
          var entries = dirEntries(path, ctx);
          entries.forEach(function (e, i) {
            var last = i === entries.length - 1, branch = last ? '└── ' : '├── ', next = last ? '    ' : '│   ';
            lines.push(STYLE.border + prefix + branch + RESET + (e.dir ? STYLE.dir + e.name + '/' + RESET : e.name));
            if (e.dir) { count.dirs++; rec(path === '' ? e.name : path + '/' + e.name, prefix + next); } else { count.files++; }
          });
        };
        rec(p, '');
        lines.push('');
        lines.push(DIM + count.dirs + ' director' + (count.dirs === 1 ? 'y' : 'ies') + ', ' + count.files + ' file' + (count.files === 1 ? '' : 's') + RESET);
        ctx.stdout.print(lines.join('\n'));
      } },
      { name: 'more', description: 'page a document or stdin: more [path]', run: function (ctx, argv) {
        var p = argv[1], text = null;
        if (p) { text = docText(ctx, p); if (text === null) { ctx.stdout.print('more: ' + p + ': no such file'); return; } }
        else if (ctx.stdin) { text = ctx.stdin; }
        if (text === null) { ctx.stdout.print('usage: more [path]'); return; }
        if (!ctx.tty) { ctx.stdout.write(text); return; }
        return pager(ctx, text);
      } },
      { name: 'cd', description: 'change directory: cd <dir>', builtin: true, run: function (ctx, argv) {
        var err = ctx.chdir(argv[1] || '/'); if (err) { ctx.stdout.print('cd: ' + err); }
      } },
      { name: 'pwd', description: 'print the working directory', builtin: true, run: function (ctx) {
        ctx.stdout.print(ctx.cwd === '' ? '/' : '/' + ctx.cwd);
      } },
      { name: 'wc', description: 'count lines/words/bytes from stdin: wc [-lwc]', run: function (ctx, argv) {
        var s = ctx.stdin, flag = argv.slice(1).filter(function (a) { return /^-[lwc]+$/.test(a); })[0];
        var want = function (c) { return !flag || flag.indexOf(c) >= 0; };
        var l = (s.match(/\n/g) || []).length, w = s.trim().split(/\s+/).filter(Boolean).length, out = [];
        if (want('l')) { out.push(String(l)); } if (want('w')) { out.push(String(w)); } if (want('c')) { out.push(String(s.length)); }
        ctx.stdout.print(out.join('\t'));
      } },
      { name: 'clear', description: 'clear the screen', run: function (ctx) { ctx.term.clear(); } },
      { name: 'exit', description: 'return to the home page (same as Ctrl-D on an empty line)', run: function (ctx) {
        ctx.chdir('/'); var home = ctx.resolve('index'); if (home) { return home.run(ctx, ['index']); }
      } },
      { name: 'whoami', description: 'who runs this site', run: function (ctx) { ctx.stdout.print('yzhao'); } }
    ];
    COMMANDS.push(Object.assign({}, COMMANDS.filter(function (c) { return c.name === 'more'; })[0], { name: 'less', description: 'page a document or stdin: less [path]' }));

    // ------------------------------------------------------------------
    // Boot.
    // ------------------------------------------------------------------
    var host = document.getElementById('term-host'), screen = document.getElementById('term-screen');
    var hashCmd = function () { return location.hash.replace(/^#/, '').trim(); };
    var initial = hashCmd() || 'index';
    var shell;
    var term = new Term(screen, function (slug) {
      history.pushState({ cmd: slug }, '', '#' + slug);
      shell.inject(slug);
    });
    var registry = makeRegistry(), store = makeStore(DOCUMENTS);
    COMMANDS.forEach(function (c) { registry.register(c); });
    store.all().forEach(function (d) { registry.register(docCommand(d)); });
    shell = new Shell({ term: term, registry: registry, store: store, initialCommand: initial });
    window.addEventListener('popstate', function (e) {
      var cmd = (e.state && e.state.cmd) || hashCmd() || 'index';
      shell.inject(cmd);
    });
    history.replaceState({ cmd: initial }, '', location.pathname + location.search);
    shell.start();

    var revealed = false;
    var reveal = function () {
      if (revealed) { return; }
      revealed = true;
      try { term.fit(); } finally { host.classList.add('ready'); term.focus(); }
    };
    if (document.fonts && document.fonts.ready) { document.fonts.ready.then(reveal); } else { reveal(); }
    setTimeout(reveal, 1500);
  })();
  </script>
</body>
